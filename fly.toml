# fly.toml app configuration file generated for automaterx on 2026-09-06T19:01:49-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'automaterx'
primary_region = 'ord'

[build]
[env]
  DB_PATH = '/data/automaterx.db'
  GOOGLE_SERVICE_ACCOUNT_JSON = '/app/google-service-account.json'
  PORT = '8080'

[[mounts]]
  source = 'automaterx_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
